[project]
name = "helix-sentinel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0.0",
    "numpy>=1.26.0",
    "torch>=2.0.0",
    "h5py>=3.10.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "helix-sdk @ git+ssh://git@github.com/otaviohrg/helix-core.git#subdirectory=shared/sdk",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]
